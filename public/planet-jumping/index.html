<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Planet Jumping</title>
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<style>
/* ───────────── Fonts (local only; fallbacks keep the layout intact) ───────────── */
@font-face{font-family:"SF Pro";font-weight:400;font-style:normal;
  src:local("SF Pro Text"),local("SF Pro Text Regular"),local("SFProText-Regular"),local("SF Pro"),local("Arial"),local("ArialMT")}
@font-face{font-family:"SF Pro";font-weight:700;font-style:normal;
  src:local("SF Pro Text Bold"),local("SFProText-Bold"),local("SF Pro Bold"),local("Arial Bold"),local("Arial-BoldMT")}
@font-face{font-family:"SF Pro Thin";font-weight:100;font-style:normal;
  src:local("SF Pro Display Thin"),local("SFProDisplay-Thin"),local("SF Pro Thin"),local("Helvetica Neue Thin"),local("HelveticaNeue-Thin"),local("Arial"),local("ArialMT")}
@font-face{font-family:"Aalto";font-weight:400;font-style:normal;
  src:local("Aalto"),local("Arial Narrow"),local("ArialNarrow"),local("Arial-NarrowMT")}

:root{font-family:'SF Pro',Arial,sans-serif;color:#fff;background:#090807;font-synthesis:none}

/* ───────────── Base layout ───────────── */
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
html,body,button,a,.portal{cursor:none!important}
.experience{position:relative;width:100%;height:100%;min-height:540px;overflow:hidden;background:#0a0908}
.backgrounds,.background,.shade,.transition-layer,.transition-layer video{position:absolute;inset:0;width:100%;height:100%}
.background{object-fit:cover;opacity:0;transition:opacity .8s ease}
.background.is-visible{opacity:1}
.shade{z-index:1;background:linear-gradient(to bottom,transparent 52%,rgba(0,0,0,.88) 100%);pointer-events:none}
.chrome{position:absolute;z-index:4;transition:opacity .45s ease,filter .45s ease}
.experience.is-transitioning .chrome{opacity:0;filter:blur(8px);pointer-events:none}

/* Header */
.header{left:clamp(18px,1.95vw,28px);right:clamp(18px,1.95vw,28px);top:clamp(18px,3.1vh,28px);
  display:flex;justify-content:space-between;align-items:center}
.header-actions{margin-left:auto;display:flex;align-items:center}
.nav{display:flex;align-items:center;height:42px;padding:4px 5px;border:1px solid rgba(255,255,255,.45);
  background:rgba(255,255,255,.1);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-radius:999px}
.nav a{color:#fff;text-decoration:none;padding:8px 19px;border-radius:999px;line-height:1}
.nav a.active{background:#fff;color:#000}
.menu{height:42px;padding:0 20px;border:0;border-radius:999px;background:#fff;color:#000;font:inherit;cursor:pointer}

/* Planet list */
.planet-list{left:clamp(18px,1.95vw,28px);top:50%;transform:translateY(-43%);
  display:flex;flex-direction:column;gap:6px;font-size:16px}
.planet-item{display:flex;align-items:center;min-height:20px}
.planet-item.active{font-size:18px;font-weight:700;gap:8px}
.planet-item.active:before{content:'';width:16px;height:16px;border-radius:50%;background:#fff}

/* Portal (the real media elements are invisible pixel sources for the canvas) */
.portal-wrap{left:50%;top:50%;width:min(320px,31vw);transform:translate(-50%,-54%);perspective:none}
.portal-heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:16px;opacity:0}
.portal-heading strong{font-size:18px;margin-left:8px}
.portal{position:relative;display:block;width:100%;aspect-ratio:320/350;padding:0;overflow:visible;border:0;
  border-radius:90px;background:transparent;cursor:pointer;box-shadow:none;transform:none!important}
.portal video,.portal img{visibility:hidden;position:absolute;width:1px;height:1px;pointer-events:none}
.portal-canvas{position:fixed;inset:0;z-index:3;width:100%;height:100%;pointer-events:none}

/* Planet content */
.planet-content{left:clamp(28px,4vw,58px);right:clamp(28px,3vw,44px);bottom:clamp(24px,3vh,30px);
  display:flex;justify-content:space-between;align-items:flex-end;gap:40px}
.planet-content h1{font-family:Aalto,'Arial Narrow',Impact,sans-serif;font-size:clamp(128px,21.8vw,314px);
  font-weight:400;line-height:.72;margin:0 0 -.04em;letter-spacing:0;--title-x:-32px;transform:translateX(var(--title-x));opacity:0}
.planet-content dl{width:min(447px,34vw);margin:0;font-size:16px}
.fact{display:grid;grid-template-columns:138px 1fr;gap:18px;padding:8px 0;
  border-bottom:1px solid rgba(255,255,255,.48);opacity:0}
.fact:last-child{border-bottom:0}
.fact dt{font-weight:700}
.fact dd{margin:0}

/* Misc */
.transition-layer{display:none}
.scene-canvas{display:none}
.loading{position:absolute;z-index:12;left:50%;bottom:30px;transform:translateX(-50%);opacity:0;
  font-size:12px;letter-spacing:.14em;text-transform:uppercase;transition:opacity .2s}
.experience.is-loading .loading{opacity:.8}
.experience.is-transitioning .header,.experience.is-transitioning .planet-list{opacity:1;filter:none;pointer-events:auto}
.experience.is-transitioning .shade{opacity:1}
.experience.is-committing .background{transition:none!important}

/* ───────────── Preloader ───────────── */
.preloader{position:absolute;inset:0;z-index:20;background:#000;overflow:hidden}
.preloader video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.preloader-shade{position:absolute;inset:auto 0 0;height:35%;background:linear-gradient(to bottom,transparent,#000)}
.preloader.is-background{z-index:0}
.preloader.is-background .preloader-shade{opacity:0}
.floating-logo{position:fixed;z-index:22;left:50%;top:50%;width:59px;height:58px;transform:translate(-50%,-50%);
  will-change:left,top,width,height,transform;
  transition:left 2s cubic-bezier(.16,1,.3,1),top 2s cubic-bezier(.16,1,.3,1),width 2s cubic-bezier(.16,1,.3,1),
    height 2s cubic-bezier(.16,1,.3,1),transform 2s cubic-bezier(.16,1,.3,1)}
.floating-logo.is-docked{left:clamp(18px,1.95vw,28px);top:clamp(18px,3.1vh,28px);width:37px;height:36px;transform:none}
.floating-logo.is-settled{z-index:5}
.preloader-count{position:fixed;z-index:22;left:50%;bottom:clamp(22px,3.1vh,28px);display:flex;align-items:flex-end;
  gap:4px;transform:translateX(-50%);font-family:'SF Pro',Arial,sans-serif;line-height:1}
.preloader-count>span:first-child{font-family:'SF Pro Thin','SF Pro',Arial,sans-serif;font-size:64px;font-weight:100}
.preloader-count .percent{font-size:24px;padding-bottom:4px}
.preloader-count.is-leaving{animation:preload-count-out .75s cubic-bezier(.22,1,.36,1) both}
@keyframes preload-count-out{to{opacity:0;filter:blur(7px);transform:translate(-50%,-34px)}}
body:not(.preload-complete) .custom-cursor{opacity:0!important}

/* ───────────── Custom cursor ───────────── */
.custom-cursor{display:block;position:fixed;left:0;top:0;z-index:100;width:1px;height:1px;
  pointer-events:none;opacity:0;transition:opacity .2s ease}
.custom-cursor.is-visible{opacity:1}
.cursor-dot,.cursor-orbit{position:absolute;left:0;top:0;border-radius:50%;transform:translate(-50%,-50%)}
.cursor-dot{width:12px;height:12px;background:#fff}
.cursor-orbit{width:36px;height:36px;border:1px solid #fff;background:rgba(255,255,255,.4);
  transition:transform .3s cubic-bezier(.22,1,.36,1)}
.custom-cursor.is-enter .cursor-orbit{transform:translate(-50%,-50%) scale(1.16)}
.cursor-label{position:absolute;top:26px;left:0;transform:translateX(-50%) translateY(-4px);
  font:16px/1.2 'SF Pro',Arial,sans-serif;white-space:nowrap;opacity:0;
  transition:opacity .2s ease,transform .3s cubic-bezier(.22,1,.36,1)}
.custom-cursor.is-enter .cursor-label{opacity:1;transform:translateX(-50%) translateY(0)}

/* ───────────── Entrance / switch animations ───────────── */
body:not(.intro-ready) :is(.header,.planet-list,.planet-content h1,.planet-content .fact){opacity:0}
.intro-ready .header{animation:reveal-down .9s cubic-bezier(.22,1,.36,1) .1s both}
.intro-ready .planet-list{animation:reveal-side .9s cubic-bezier(.22,1,.36,1) .65s both}
.content-revealing h1{animation:title-rise 1.05s cubic-bezier(.16,1,.3,1) both}
.content-revealing .fact{animation:fact-rise .72s cubic-bezier(.22,1,.36,1) both}
.content-revealing .fact:nth-child(1){animation-delay:.52s}
.content-revealing .fact:nth-child(2){animation-delay:.68s}
.content-revealing .fact:nth-child(3){animation-delay:.84s}
.content-revealing .fact:nth-child(4){animation-delay:1s}
.mask-revealing .portal-heading{animation:portal-caption .85s cubic-bezier(.22,1,.36,1) both}
.planet-list.is-switching .planet-item{animation:menu-row .58s cubic-bezier(.22,1,.36,1) both}
.planet-list.is-switching .planet-item:nth-child(1){animation-delay:.02s}
.planet-list.is-switching .planet-item:nth-child(2){animation-delay:.05s}
.planet-list.is-switching .planet-item:nth-child(3){animation-delay:.08s}
.planet-list.is-switching .planet-item:nth-child(4){animation-delay:.11s}
.planet-list.is-switching .planet-item:nth-child(5){animation-delay:.14s}
.planet-list.is-switching .planet-item:nth-child(6){animation-delay:.17s}
.planet-list.is-switching .planet-item:nth-child(7){animation-delay:.2s}
.planet-list.is-switching .planet-item:nth-child(8){animation-delay:.23s}
.planet-list.is-switching .planet-item.active:before{animation:active-dot .55s cubic-bezier(.22,1,.36,1) .18s both}

@keyframes reveal-down{from{opacity:0;filter:blur(8px);transform:translateY(-18px)}to{opacity:1;filter:blur(0);transform:translateY(0)}}
@keyframes reveal-side{from{opacity:0;filter:blur(8px);transform:translate(-20px,-43%)}to{opacity:1;filter:blur(0);transform:translate(0,-43%)}}
@keyframes title-rise{from{opacity:0;filter:blur(12px);transform:translate(var(--title-x),42px)}to{opacity:1;filter:blur(0);transform:translate(var(--title-x),0)}}
@keyframes fact-rise{from{opacity:0;filter:blur(7px);transform:translateY(18px)}to{opacity:1;filter:blur(0);transform:translateY(0)}}
@keyframes portal-caption{from{opacity:0;filter:blur(7px);transform:translateY(22px)}to{opacity:1;filter:blur(0);transform:translateY(0)}}
@keyframes menu-row{from{opacity:.35;transform:translateX(-8px)}to{opacity:1;transform:translateX(0)}}
@keyframes active-dot{from{opacity:0;transform:scale(0)}to{opacity:1;transform:scale(1)}}

/* ───────────── Responsive ───────────── */
@media(max-width:900px){
  .nav{display:none}
  .portal-wrap{width:min(300px,48vw)}
  .planet-content h1{font-size:clamp(105px,24vw,190px)}
  .planet-content dl{width:43vw}
  .fact{grid-template-columns:110px 1fr}
  .planet-list{font-size:14px}
  .planet-item.active{font-size:16px}
}
@media(max-width:640px){
  .experience{min-height:600px}
  .planet-list{display:none}
  .portal-wrap{top:44%;width:min(260px,66vw)}
  .planet-content{left:18px;right:18px;bottom:18px;display:block}
  .planet-content h1{font-size:clamp(98px,30vw,160px);margin-bottom:20px;--title-x:0px}
  .planet-content dl{width:100%;font-size:13px}
  .fact{grid-template-columns:92px 1fr;padding:5px 0}
  .portal-heading{font-size:14px}
  .portal-heading strong{font-size:16px}
  .menu{height:38px}
  .portal{border-radius:70px}
}
@media(prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}.portal{transform:none!important}}
</style>
</head>
<body>
<main class="experience" data-planet="mars">
  <div class="backgrounds" aria-hidden="true">
    <video id="mars-background" class="background is-visible" src="mars-background.mp4" muted playsinline preload="auto"></video>
    <video id="earth-background" class="background" src="to-earth.mp4" muted playsinline preload="metadata"></video>
    <video id="venus-background" class="background" src="to-venus.mp4" muted playsinline preload="metadata"></video>
  </div>

  <div class="preloader" id="preloader" aria-label="Loading Mars">
    <video id="preloader-video" src="to-mars.mp4" muted playsinline preload="auto"></video>
    <div class="preloader-shade"></div>
  </div>
  <img class="floating-logo" id="floating-logo" src="logo.svg" alt="Ubernatural">
  <div class="preloader-count" id="preloader-count" aria-live="polite"><span id="preloader-value">0</span><span class="percent">%</span></div>

  <canvas id="scene-canvas" class="scene-canvas" aria-hidden="true"></canvas>
  <div class="shade" aria-hidden="true"></div>

  <header class="header chrome">
    <div class="header-actions">
      <nav class="nav" aria-label="Primary navigation">
        <a class="active" href="#about">About</a><a href="#explore">Explore</a><a href="#planets">Planets</a>
      </nav>
      <button class="menu" type="button">Menu</button>
    </div>
  </header>

  <aside class="planet-list chrome" aria-label="Planets"></aside>

  <canvas id="portal-canvas" class="portal-canvas" aria-hidden="true"></canvas>
  <section class="portal-wrap chrome" aria-label="Next destination">
    <div class="portal-heading">
      <span>Next:</span>
      <span><span id="next-number">[03]</span> <strong id="next-name">Earth</strong></span>
    </div>
    <button class="portal" id="portal" type="button" aria-label="Travel to Earth">
      <video id="portal-video" src="to-earth.mp4" muted playsinline preload="auto"></video>
      <img id="portal-image" src="mercury.jpg" alt="Mercury">
    </button>
  </section>

  <section class="planet-content chrome" aria-live="polite">
    <h1 id="planet-title">MARS</h1>
    <dl id="facts"></dl>
  </section>

  <div class="transition-layer" aria-hidden="true"><video id="transition-video" muted playsinline preload="auto"></video></div>
  <div class="loading" aria-hidden="true">Preparing orbit…</div>
  <div class="custom-cursor" aria-hidden="true">
    <span class="cursor-orbit"></span><span class="cursor-dot"></span><span class="cursor-label">Enter</span>
  </div>
</main>

<script>
(() => {
  'use strict';

  /* ───────────── Data ───────────── */
  // Media sits next to this file (re-encoded to 8-bit H.264 for smooth playback). Relative URLs keep the page
  // working under any base path, e.g. username.github.io/repo/planet-jumping/ — always open it WITH the trailing slash.
  const TO_EARTH = 'to-earth.mp4';
  const TO_VENUS = 'to-venus.mp4';
  const MERCURY = 'mercury.jpg';

  const planets = ['Mercury', 'Venus', 'Earth', 'Mars', 'Jupiter', 'Saturn', 'Uranus', 'Neptune'];

  const states = {
    mars: {
      name: 'Mars', next: 'Earth', number: '[03]', portal: TO_EARTH, background: 'mars-background',
      facts: [
        ['Distance:', 'About 228 million km (1.5 astronomical units).'],
        ['Year:', 'One Martian year is equal to 687 Earth days.'],
        ['Temperature:', 'Around -60 °C, dropping to -125 °C at the poles in winter.'],
        ['Atmosphere:', 'Very thin, consisting of 95% carbon dioxide, with frequent dust storms.'],
      ],
    },
    earth: {
      name: 'Earth', next: 'Venus', number: '[02]', portal: TO_VENUS, background: 'earth-background',
      facts: [
        ['Distance:', '149.6 million km from the Sun.'],
        ['Year:', '365.25 Earth days.'],
        ['Temperature:', 'Average surface temperature around 15 °C.'],
        ['Atmosphere:', 'Mostly nitrogen and oxygen, supporting life and liquid water.'],
      ],
    },
    venus: {
      name: 'Venus', next: 'Mercury', number: '[06]', image: MERCURY, background: 'venus-background',
      facts: [
        ['Distance:', '108.2 million km from the Sun.'],
        ['Year:', '225 Earth days.'],
        ['Temperature:', 'Around 465 °C — the hottest planet in the Solar System.'],
        ['Atmosphere:', 'Extremely dense, mostly carbon dioxide, with clouds of sulfuric acid.'],
      ],
    },
  };

  /* ───────────── Elements ───────────── */
  const $ = (id) => document.getElementById(id);
  const experience = document.querySelector('.experience');
  const planetList = document.querySelector('.planet-list');
  const backgrounds = Array.from(document.querySelectorAll('.background'));
  const planetTitle = $('planet-title');
  const factsEl = $('facts');
  const nextName = $('next-name');
  const nextNumber = $('next-number');
  const portal = $('portal');
  const portalVideo = $('portal-video');
  const portalImage = $('portal-image');
  const transitionVideo = $('transition-video');
  const portalCanvas = $('portal-canvas');
  const sceneCanvas = $('scene-canvas');
  const ctx = portalCanvas.getContext('2d');
  const sctx = sceneCanvas.getContext('2d');
  const cursor = document.querySelector('.custom-cursor');
  const cursorOrbit = document.querySelector('.cursor-orbit');
  const cursorLabel = document.querySelector('.cursor-label');
  const cursorDot = document.querySelector('.cursor-dot');

  /* ───────────── State ───────────── */
  let current = 'mars';
  let busy = false;
  let renderCount = 0;
  let rotX = 0, rotY = 0, targetX = 0, targetY = 0;
  let expansion = 0;          // 0 → portal window, 1 → fills the viewport
  let maskScale = 0;          // reveal scale of the window
  let canvasOpacity = 1;
  let transitionActive = false;
  let frozen = false;         // a frozen frame lives in #scene-canvas
  let lastFrame = 0;
  let portalRadius = 90;

  const raf = () => new Promise((res) => requestAnimationFrame(() => res()));
  const wait = (ms) => new Promise((res) => setTimeout(res, ms));
  const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);

  /** Drives a value 0 → 1 over `duration` ms with easeInOutCubic. */
  function animateValue(setter, duration) {
    return new Promise((resolve) => {
      const t0 = performance.now();
      const step = (now) => {
        const t = Math.min(1, (now - t0) / duration);
        setter(ease(t));
        if (t < 1) requestAnimationFrame(step);
        else resolve();
      };
      requestAnimationFrame(step);
    });
  }

  /** Resolves on the first of `events` (or after `timeout` ms). Never rejects. */
  function waitFor(el, events, timeout) {
    return new Promise((resolve) => {
      let done = false;
      const finish = () => {
        if (done) return;
        done = true;
        events.forEach((e) => el.removeEventListener(e, finish));
        clearTimeout(timer);
        resolve();
      };
      events.forEach((e) => el.addEventListener(e, finish));
      const timer = setTimeout(finish, timeout);
    });
  }

  const currentMedia = () => (states[current].image ? portalImage : portalVideo);

  /** Resolves when the media can supply pixels (image decoded / video has a frame). */
  function mediaReady(media, timeout = 4000) {
    if (media instanceof HTMLImageElement) {
      if (media.complete && media.naturalWidth) return Promise.resolve();
      return waitFor(media, ['load', 'error'], timeout);
    }
    if (media.readyState >= 2) return Promise.resolve();
    return waitFor(media, ['loadeddata', 'canplay', 'error'], timeout);
  }

  function playPortalVideo() {
    if (states[current].image) return;
    portalVideo.loop = true;
    const p = portalVideo.play();
    if (p && p.catch) p.catch(() => {});
  }

  /* ───────────── Render ───────────── */
  function render() {
    const s = states[current];
    experience.dataset.planet = current;
    planetTitle.textContent = s.name.toUpperCase();
    nextName.textContent = s.next;
    nextNumber.textContent = s.number;
    portal.setAttribute('aria-label', `Travel to ${s.next}`);

    factsEl.textContent = '';
    for (const [key, value] of s.facts) {
      const row = document.createElement('div');
      row.className = 'fact';
      const dt = document.createElement('dt');
      dt.textContent = key;
      const dd = document.createElement('dd');
      dd.textContent = value;
      row.append(dt, dd);
      factsEl.append(row);
    }

    planetList.textContent = '';
    for (const name of planets) {
      const item = document.createElement('span');
      item.className = 'planet-item' + (name === s.name ? ' active' : '');
      item.textContent = name;
      planetList.append(item);
    }
    if (renderCount > 0) {
      planetList.classList.remove('is-switching');
      void planetList.offsetWidth;
      planetList.classList.add('is-switching');
    }
    renderCount++;

    backgrounds.forEach((v) => v.classList.toggle('is-visible', v.id === s.background));

    if (s.image) {
      portalImage.hidden = false;
      portalVideo.pause();
      portalVideo.hidden = true;
    } else {
      portalImage.hidden = true;
      portalVideo.hidden = false;
      if (portalVideo.getAttribute('src') !== s.portal) portalVideo.src = s.portal;
    }
  }

  /* ───────────── Canvas ───────────── */
  function sizeCanvas(canvas, c) {
    const d = Math.min(window.devicePixelRatio || 1, 1.5);
    canvas.width = Math.round(innerWidth * d);
    canvas.height = Math.round(innerHeight * d);
    canvas.style.width = innerWidth + 'px';
    canvas.style.height = innerHeight + 'px';
    c.setTransform(d, 0, 0, d, 0, 0);
  }

  function resizeCanvas() {
    portalRadius = parseFloat(getComputedStyle(portal).borderTopLeftRadius) || 90;
    sizeCanvas(portalCanvas, ctx);
    if (!frozen) sizeCanvas(sceneCanvas, sctx); // never wipe a held frame
  }

  /** Draws `media` screen-locked in "cover" mode. */
  function drawCover(c, media) {
    const mw = media.videoWidth || media.naturalWidth;
    const mh = media.videoHeight || media.naturalHeight;
    if (!mw || !mh) return;
    const scale = Math.max(innerWidth / mw, innerHeight / mh);
    const w = mw * scale;
    const h = mh * scale;
    c.drawImage(media, (innerWidth - w) / 2, (innerHeight - h) / 2, w, h);
  }

  function drawShade(c) {
    const y = innerHeight * 0.52;
    const g = c.createLinearGradient(0, y, 0, innerHeight);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(1, 'rgba(0,0,0,.88)');
    c.fillStyle = g;
    c.fillRect(0, y, innerWidth, innerHeight - y);
  }

  /** ~44 points of a w×h rounded rect (corner radius r), centred on the origin. */
  function roundedPoints(w, h, r) {
    const PI = Math.PI;
    const corners = [
      [w / 2 - r, -h / 2 + r, -PI / 2, 0],
      [w / 2 - r, h / 2 - r, 0, PI / 2],
      [-w / 2 + r, h / 2 - r, PI / 2, PI],
      [-w / 2 + r, -h / 2 + r, PI, PI * 1.5],
    ];
    const pts = [];
    for (const [cx, cy, a0, a1] of corners) {
      for (let i = 0; i <= 10; i++) {
        const a = a0 + ((a1 - a0) * i) / 10;
        pts.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]);
      }
    }
    return pts;
  }

  /** Fake perspective (focal length 850) around a centre. */
  function project(pts, rx, ry, cx, cy) {
    const ax = (rx * Math.PI) / 180;
    const ay = (ry * Math.PI) / 180;
    const cax = Math.cos(ax), sax = Math.sin(ax);
    const cay = Math.cos(ay), say = Math.sin(ay);
    return pts.map(([x, y]) => {
      const xx = x * cay;
      const yy = y * cax;
      const z = x * say - y * sax;
      const p = 850 / (850 + z);
      return [cx + xx * p, cy + yy * p];
    });
  }

  function draw(now) {
    const dt = Math.min(40, now - (lastFrame || now));
    lastFrame = now;
    const k = Math.min(1, dt * 0.009);
    rotX += (targetX - rotX) * k;
    rotY += (targetY - rotY) * k;

    ctx.clearRect(0, 0, innerWidth, innerHeight);
    if (frozen) {
      ctx.drawImage(sceneCanvas, 0, 0, innerWidth, innerHeight);
      drawShade(ctx);
    }

    const rect = portal.getBoundingClientRect();
    const e = expansion;
    const rectCx = rect.left + rect.width / 2;
    const rectCy = rect.top + rect.height / 2;
    const cx = rectCx + (innerWidth / 2 - rectCx) * e;
    const cy = rectCy + (innerHeight / 2 - rectCy) * e;
    const baseW = rect.width + (innerWidth - rect.width) * e;
    const baseH = rect.height + (innerHeight - rect.height) * e;
    const scale = e ? 1 : maskScale;
    const w = baseW * scale;
    const h = baseH * scale;
    const r = Math.min(portalRadius * (1 - e) * scale, w / 2, h / 2);

    if (w > 1 && h > 1) {
      const pts = project(roundedPoints(w, h, Math.max(0, r)), rotX * (1 - e), rotY * (1 - e), cx, cy);
      ctx.save();
      ctx.globalAlpha = canvasOpacity;
      ctx.beginPath();
      pts.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
      ctx.closePath();
      ctx.clip();
      ctx.fillStyle = '#030303';
      ctx.fillRect(0, 0, innerWidth, innerHeight);
      drawCover(ctx, transitionActive ? transitionVideo : currentMedia());
      if (transitionActive) drawShade(ctx);
      ctx.restore();
    }
    requestAnimationFrame(draw);
  }

  /* ───────────── Reveals ───────────── */
  function retrigger(cls) {
    experience.classList.remove(cls);
    void experience.offsetWidth;
    experience.classList.add(cls);
  }

  function revealMask() {
    retrigger('mask-revealing');
    maskScale = 0;
    return animateValue((v) => (maskScale = v), 1050);
  }

  function revealPlanetContent() {
    retrigger('content-revealing');
  }

  /* ───────────── Travel ───────────── */
  async function travel() {
    if (busy || current === 'venus') return;
    busy = true;
    targetX = targetY = 0;
    try {
      const next = current === 'mars' ? 'earth' : 'venus';

      transitionVideo.src = states[current].portal;
      transitionVideo.load();
      experience.classList.add('is-loading');
      await waitFor(transitionVideo, ['canplaythrough', 'error'], 1600);

      experience.classList.remove('is-loading', 'content-revealing', 'mask-revealing');
      experience.classList.add('is-transitioning');
      transitionVideo.currentTime = 0;
      transitionVideo.playbackRate = 1.3;
      canvasOpacity = 1;
      transitionActive = true;
      const ended = transitionVideo.ended
        ? Promise.resolve()
        : waitFor(transitionVideo, ['ended', 'error'], Math.max(5000, ((transitionVideo.duration || 6) / 1.3) * 1000 + 3000));
      await transitionVideo.play();

      await animateValue((v) => (expansion = v), 1100);
      await ended;

      // Freeze the final frame so the next scene starts exactly where this one ended.
      sizeCanvas(sceneCanvas, sctx);
      sctx.clearRect(0, 0, innerWidth, innerHeight);
      drawCover(sctx, transitionVideo);
      frozen = true;

      current = next;
      experience.classList.add('is-committing');
      render();
      playPortalVideo();
      await raf();
      await raf();

      transitionActive = false;
      expansion = 0;
      maskScale = 0;
      canvasOpacity = 1;
      experience.classList.remove('is-transitioning', 'is-committing');

      await mediaReady(currentMedia(), 3000);
      const maskReveal = revealMask();
      await wait(100);
      revealPlanetContent();
      await maskReveal;

      await wait(450);
      transitionVideo.removeAttribute('src');
      transitionVideo.load();
      busy = false;
    } catch (err) {
      transitionActive = false;
      expansion = 0;
      maskScale = 1;
      canvasOpacity = 1;
      experience.classList.remove('is-transitioning', 'is-committing', 'is-loading');
      busy = false;
    }
  }

  /* ───────────── Pointer: tilt + cursor ───────────── */
  let curX = 0, curY = 0, ptrX = 0, ptrY = 0, cursorSeen = false;

  window.addEventListener('pointermove', (e) => {
    if (e.pointerType === 'touch') return;
    ptrX = e.clientX;
    ptrY = e.clientY;
    if (!cursorSeen) {
      cursorSeen = true;
      curX = ptrX;
      curY = ptrY;
    }
    cursor.classList.add('is-visible');
    if (busy) return;
    targetY = (e.clientX / innerWidth - 0.5) * 37.4;
    targetX = (e.clientY / innerHeight - 0.5) * -33;
  });
  document.documentElement.addEventListener('pointerleave', () => {
    targetX = targetY = 0;
  });
  document.documentElement.addEventListener('mouseleave', () => cursor.classList.remove('is-visible'));
  portal.addEventListener('pointerenter', (e) => {
    if (e.pointerType !== 'touch') cursor.classList.add('is-enter');
  });
  portal.addEventListener('pointerleave', () => cursor.classList.remove('is-enter'));
  portal.addEventListener('click', travel);

  function cursorLoop() {
    curX += (ptrX - curX) * 0.2;
    curY += (ptrY - curY) * 0.2;
    // Container tracks the pointer; ring + label trail behind with easing.
    cursor.style.transform = `translate3d(${ptrX}px,${ptrY}px,0)`;
    const trail = `${curX - ptrX}px ${curY - ptrY}px`;
    cursorOrbit.style.translate = trail;
    cursorLabel.style.translate = trail;
    requestAnimationFrame(cursorLoop);
  }

  /* ───────────── Preloader ───────────── */
  function runPreloader() {
    const video = $('preloader-video');
    const preloader = $('preloader');
    const count = $('preloader-count');
    const value = $('preloader-value');
    const logo = $('floating-logo');
    let finished = false;
    let started = false;

    const finish = () => {
      if (finished) return;
      finished = true;
      value.textContent = '100';
      count.classList.add('is-leaving');
      logo.classList.add('is-docked');
      preloader.classList.add('is-background');
      document.body.classList.add('preload-complete');
      startExperience();
      setTimeout(() => count.remove(), 750);
      setTimeout(() => logo.classList.add('is-settled'), 2000);
    };

    const tick = () => {
      if (finished) return;
      if (video.duration) value.textContent = String(Math.min(99, Math.round((video.currentTime / video.duration) * 100)));
      requestAnimationFrame(tick);
    };

    const start = async () => {
      if (started) return;
      started = true;
      video.playbackRate = Math.max(0.25, Math.min(16, video.duration / 3));
      try {
        await video.play();
      } catch (err) {
        finish();
        return;
      }
      tick();
      // Safety net: never leave the visitor on the loader.
      setTimeout(finish, Math.max(6000, (video.duration / video.playbackRate) * 1000 + 3000));
    };

    video.addEventListener('ended', finish);
    video.addEventListener('error', finish);
    if (video.readyState >= 1) start();
    else video.addEventListener('loadedmetadata', start, { once: true });
    setTimeout(() => { if (!started) finish(); }, 15000);
  }

  async function startExperience() {
    await mediaReady(currentMedia(), 4000);
    playPortalVideo();
    await revealMask();
    document.body.classList.add('intro-ready');
    setTimeout(revealPlanetContent, 850);
  }

  /* ───────────── Boot ───────────── */
  backgrounds.forEach((v) => {
    v.pause();
    try { v.currentTime = 0; } catch (err) { /* metadata not loaded yet */ }
  });
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);
  render();
  requestAnimationFrame(draw);
  requestAnimationFrame(cursorLoop);
  runPreloader();
})();
</script>
</body>
</html>
