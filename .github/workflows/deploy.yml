name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # lets you re-run it from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # `<user>.github.io` repos are served from the domain root; every other repo from /<repo>/.
      # Using a custom domain? Add a repository VARIABLE named CUSTOM_DOMAIN (e.g. chinmaylale.dev) and set the same
      # domain under Settings → Pages. The site is then built for the root of that domain.
      - name: Work out the base path and public URL
        env:
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"   # Pages hostnames are lower-case
          if [[ -n "$CUSTOM_DOMAIN" ]]; then
            BASE=""; SITE="https://${CUSTOM_DOMAIN}"
          elif [[ "$REPO" == *.github.io ]]; then
            BASE=""; SITE="https://${OWNER}.github.io"
          else
            BASE="/$REPO"; SITE="https://${OWNER}.github.io/$REPO"
          fi
          echo "NEXT_PUBLIC_BASE_PATH=$BASE" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SITE_URL=$SITE" >> "$GITHUB_ENV"   # canonical links, Open Graph, sitemap, JSON-LD
          echo "Base path: '${BASE}' | Site URL: ${SITE}"

      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
